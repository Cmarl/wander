<!doctype html><meta charset=utf8>
<!--
  Do the shaders compile, and do they draw anything?

  The boot gate catches a module that throws. It cannot catch a GLSL error:
  three logs the compile log to the console and carries on, the HUD builds
  normally, and the game ships with a black world. Every graphics change needs
  its own gate and this is it.

  Compiles the real Terrain, Water, Sky and Grass materials in a real GL
  context, then draws each one and reads the pixels back. A shader that
  compiles but renders black is just as broken as one that does not compile,
  so both are checked.

  Run:  npm run dev
        open http://localhost:5173/tools/shader-check.html

  Not a build entry: vite builds index.html only, so this never ships.
--><body><pre id=out></pre>
<script type="module">
import * as THREE from "three";
import { Terrain } from "../src/world/terrain.ts";
import { Water } from "../src/world/water.ts";
import { Sky } from "../src/world/sky.ts";
import { Grass } from "../src/world/grass.ts";
import { heightAt } from "../src/world/field.ts";
import { worldLit, WORLD_UNIFORMS } from "../src/world/worldMaterial.ts";
import { makeFor } from "../src/game/vehicles.ts";

const out = document.getElementById("out");
const lines = [];
const log = (s) => { out.textContent += s + "\n"; lines.push(s); };
const send = () => fetch("http://127.0.0.1:8915/", { method: "POST", body: lines.join("\n") }).catch(() => {});
let bad = 0;
const check = (ok, label, detail) => { if (!ok) bad++; log(`${ok ? "  ok  " : "  FAIL"}  ${label.padEnd(40)} ${detail}`); };

// three reports GLSL failures through console.error and keeps going, so the
// only way to see them is to listen.
const errors = [];
const realError = console.error.bind(console);
console.error = (...a) => { errors.push(a.map(String).join(" ")); realError(...a); };
window.onerror = (m, f, l) => { log(`THREW: ${m} (line ${l})`); send(); };

const canvas = document.createElement("canvas");
canvas.width = 256; canvas.height = 256;
const renderer = new THREE.WebGLRenderer({ canvas, antialias: false, preserveDrawingBuffer: true });
renderer.setSize(256, 256, false);

const camera = new THREE.PerspectiveCamera(70, 1, 0.1, 1e5);
camera.position.set(0, 240, 0);
camera.lookAt(600, 60, 600);

const terrain = new Terrain();
const water = new Water(20000);
const sky = new Sky(camera);
const grass = new Grass({ side: 24, spacing: 2.2, blades: 3 });

// A plausible noon, so nothing is black for an honest reason.
const sun = new THREE.Vector3(0.3, 0.72, 0.62).normalize();
for (const m of [terrain.material, water.material, grass.material, sky.material]) {
  const u = m.uniforms;
  if (u.uSunDir) u.uSunDir.value.copy(sun);
  if (u.uSunColor) u.uSunColor.value.setRGB(1.5, 1.4, 1.2);
  if (u.uSkyAmbient) u.uSkyAmbient.value.setRGB(0.3, 0.4, 0.55);
  if (u.uCloudCover) u.uCloudCover.value = 0.52;
  if (u.uTime) u.uTime.value = 40;
}

const stats = (name) => {
  const px = new Uint8Array(256 * 256 * 4);
  renderer.getContext().readPixels(0, 0, 256, 256, 6408 /* RGBA */, 5121 /* UNSIGNED_BYTE */, px);
  let sum = 0, min = 255, max = 0, nonBlack = 0;
  for (let i = 0; i < px.length; i += 4) {
    const v = (px[i] + px[i + 1] + px[i + 2]) / 3;
    sum += v; min = Math.min(min, v); max = Math.max(max, v);
    if (v > 6) nonBlack++;
  }
  const n = px.length / 4;
  return { name, mean: sum / n, min, max, cover: nonBlack / n };
};

const draw = (label, obj, cam = camera) => {
  const scene = new THREE.Scene();
  scene.add(obj);
  renderer.render(scene, cam);
  const s = stats(label);
  log(`${label.padEnd(9)} mean ${s.mean.toFixed(1).padStart(5)}  range ${s.min}-${s.max}  ` +
      `${(s.cover * 100).toFixed(0)}% of the frame is lit`);
  return s;
};

// The sky is parented to the camera, so the camera has to be in the scene.
const skyScene = new THREE.Scene();
skyScene.add(camera);
renderer.render(skyScene, camera);
const skyS = stats("sky");
log(`sky       mean ${skyS.mean.toFixed(1).padStart(5)}  range ${skyS.min}-${skyS.max}  ${(skyS.cover * 100).toFixed(0)}% of the frame is lit`);
check(skyS.cover > 0.95, "the sky draws", `${(skyS.cover * 100).toFixed(0)}% lit`);

const tS = draw("terrain", terrain.group);
check(tS.cover > 0.2, "the terrain draws", `${(tS.cover * 100).toFixed(0)}% lit`);
check(tS.max - tS.min > 20, "and it has shading in it, not one flat tone", `range ${tS.min}-${tS.max}`);

water.update(0, 0);
const wS = draw("water", water.mesh);
check(wS.cover > 0.2, "the water draws", `${(wS.cover * 100).toFixed(0)}% lit`);

/**
 * Grass needs its own camera, and the reason is worth keeping.
 *
 * The field is one 53 m patch around the player, so from 240 m up looking the
 * other way it is simply not in frame — the probe read 0% lit and called the
 * shader broken when the shader was fine. A test that fails for a reason that
 * has nothing to do with what it is testing is worse than no test.
 */
grass.update(0, 0, 40);
// At eye height above the GROUND, not above sea level — the terrain at the
// origin is a few hundred metres up, so a camera at y = 2.2 was underground.
const gy = heightAt(0, 0);
const low = new THREE.PerspectiveCamera(70, 1, 0.1, 1e4);
low.position.set(0, gy + 1.7, 0);
low.lookAt(16, gy + 0.4, 16);
low.updateMatrixWorld(true);
const gS = draw("grass", grass.mesh, low);
check(gS.cover > 0.001, "the grass draws", `${(gS.cover * 100).toFixed(2)}% lit`);

// --- the patched world materials --------------------------------------------
/**
 * Props, landmarks and vehicles are ordinary three materials patched by
 * onBeforeCompile (world/worldMaterial). That is a shader path like any other
 * and it fails like any other — a bad chunk replacement is a compile error
 * and a silently-skipped patch is an invisible one — so both are checked:
 * does it draw, and does the haze actually do something with distance.
 */
const lit = worldLit(new THREE.MeshLambertMaterial({ color: 0xb4643c, flatShading: true }));
Object.assign(WORLD_UNIFORMS.uSunDir.value ? {} : {}, {});
WORLD_UNIFORMS.uSunDir.value.copy(sun);
WORLD_UNIFORMS.uFogDensity.value = 0.00009;
WORLD_UNIFORMS.uCloudCover.value = 0.52;
WORLD_UNIFORMS.uTime.value = 40;

const litScene = new THREE.Scene();
litScene.add(new THREE.HemisphereLight(0xdfeaf2, 0x5a6b4a, 1.0));
const d = new THREE.DirectionalLight(0xfff2d8, 2.0);
d.position.copy(sun).multiplyScalar(100);
litScene.add(d);
// Instanced, because everything this patch exists for is instanced, and the
// instancing is the part that was wrong first time.
const inst = new THREE.InstancedMesh(new THREE.BoxGeometry(6, 10, 6), lit, 2);
const near3 = new THREE.Matrix4().setPosition(0, 0, -30);
/**
 * The far one is scaled up as well as moved out.
 *
 * First version just moved a 6 m box to 14 km, where it is far smaller than
 * one pixel — so the centre sample read the empty black background, the
 * "hazes with distance" assertion compared a lit box against nothing, and it
 * passed without testing anything. Green on what it had not done, which is
 * the failure mode I had just written a commit message about.
 */
const far3 = new THREE.Matrix4().makeScale(700, 700, 700).setPosition(0, 0, -14000);
inst.setMatrixAt(0, near3); inst.setMatrixAt(1, far3);
inst.instanceMatrix.needsUpdate = true;
inst.frustumCulled = false;
litScene.add(inst);

const litCam = new THREE.PerspectiveCamera(60, 1, 0.1, 60000);
litCam.position.set(0, 0, 0);
litCam.lookAt(0, 0, -100);
litCam.updateMatrixWorld(true);

const sampleAt = (cam) => {
  renderer.render(litScene, cam);
  const px = new Uint8Array(256 * 256 * 4);
  renderer.getContext().readPixels(0, 0, 256, 256, 6408, 5121, px);
  // The centre pixel, which is the box dead ahead.
  const i = ((128 * 256) + 128) * 4;
  return [px[i], px[i + 1], px[i + 2]];
};
const nearPx = sampleAt(litCam);
// Only the far one, so the centre pixel can only be the distant box.
inst.setMatrixAt(0, far3);
inst.instanceMatrix.needsUpdate = true;
const farPx = sampleAt(litCam);
const bright = (c) => (c[0] + c[1] + c[2]) / 3;
log(`patched material: near rgb ${nearPx.join(",")} (${bright(nearPx).toFixed(0)})  ` +
    `at 14 km rgb ${farPx.join(",")} (${bright(farPx).toFixed(0)})`);
check(bright(nearPx) > 10, "props and landmarks draw at all", `brightness ${bright(nearPx).toFixed(0)}`);

/**
 * The rim light, measured by turning it off and on.
 *
 * My first attempt walked a row across the near BOX and compared the last lit
 * pixel to the centre. It passed by a mile — and it passed just as wide with
 * the rim set to ZERO, because at that x I had walked onto the box's SIDE
 * face, which is simply a different Lambert normal. It was measuring "a box
 * has more than one face".
 *
 * A sphere has no faces to wander onto: the normal turns away continuously
 * toward the silhouette, which is exactly where a rim lives. And the only
 * claim worth testing is a difference the feature makes, so it renders the
 * same frame twice with nothing changed but uRim.
 */
const ball = new THREE.Mesh(new THREE.SphereGeometry(8, 32, 20), lit);
ball.position.set(0, 0, -30);
lit.color.setHex(0x4a5a3c);
lit.flatShading = false;
lit.needsUpdate = true;
litScene.add(ball);
inst.visible = false;

const ringVsCentre = () => {
  renderer.render(litScene, litCam);
  const px = new Uint8Array(256 * 256 * 4);
  renderer.getContext().readPixels(0, 0, 256, 256, 6408, 5121, px);
  const at = (x, y) => { const i = ((y * 256) + x) * 4; return (px[i] + px[i+1] + px[i+2]) / 3; };
  // Out from the centre along a row until the ball ends; the last two lit
  // pixels are the silhouette.
  let last = 0, prev = 0;
  for (let x = 128; x < 255; x++) {
    const v = at(x, 128);
    if (v < 3) break;
    prev = last; last = v;
  }
  return { centre: at(128, 128), edge: (last + prev) / 2 };
};
WORLD_UNIFORMS.uRim.value = 0;
const noRim = ringVsCentre();
WORLD_UNIFORMS.uRim.value = 0.19;
const withRim = ringVsCentre();
litScene.remove(ball);
inst.visible = true;
lit.flatShading = true;
lit.needsUpdate = true;

log(`sphere silhouette: ${noRim.edge.toFixed(1)} with no rim, ${withRim.edge.toFixed(1)} with it ` +
    `(face centre ${withRim.centre.toFixed(0)})`);
check(withRim.edge > noRim.edge + 6, "the rim actually brightens the silhouette",
  `${withRim.edge.toFixed(1)} vs ${noRim.edge.toFixed(1)}`);
check(Math.abs(withRim.centre - noRim.centre) < 4, "and leaves the face it belongs to alone",
  `centre ${withRim.centre.toFixed(1)} vs ${noRim.centre.toFixed(1)}`);
// An edge you read, not an effect you notice.
check(withRim.edge < withRim.centre * 1.7, "without turning into a glow",
  `edge ${withRim.edge.toFixed(0)} vs face ${withRim.centre.toFixed(0)}`);
// Hazed means it has gone TOWARD THE SKY, which at this sun angle is bright
// and blue. Merely "different from near" would also be satisfied by black.
check(bright(farPx) > 90, "and 14 km of it fades toward the sky, not to black", `brightness ${bright(farPx).toFixed(0)}`);

/**
 * The real test of haze: two different colours converge.
 *
 * Asking whether the far box "went blue" was wrong — a quarter of a terracotta
 * box still shows through at 14 km, so red leads whatever the air does, and
 * the assertion failed a working shader. Measuring the CONVERGENCE needs no
 * knowledge of what the sky colour happens to be at this sun angle: if the
 * air is doing its job, a red thing and a blue thing fifteen kilometres away
 * are nearly the same colour, and side by side they are not.
 */
const colourAt = (hex, matrix) => {
  lit.color.setHex(hex);
  inst.setMatrixAt(0, matrix);
  inst.instanceMatrix.needsUpdate = true;
  return sampleAt(litCam);
};
const spread = (a, b) => Math.abs(a[0]-b[0]) + Math.abs(a[1]-b[1]) + Math.abs(a[2]-b[2]);
const nearSpread = spread(colourAt(0xc0301a, near3), colourAt(0x1a40c0, near3));
const farSpread = spread(colourAt(0xc0301a, far3), colourAt(0x1a40c0, far3));
lit.color.setHex(0xb4643c);
log(`a red thing and a blue thing differ by ${nearSpread} up close, ${farSpread} at 14 km`);
check(nearSpread > 60, "two colours look different up close", `${nearSpread}`);
check(farSpread < nearSpread * 0.35, "and nearly the same through 14 km of air", `${farSpread} vs ${nearSpread}`);

// --- is the paint painted? --------------------------------------------------
/**
 * The clearcoat, measured on the REAL vehicle model.
 *
 * This was a sphere first, and the sphere was lying in both directions. It
 * said the highlight worked when a tight lobe was invisible on the actual
 * truck — 904 pixels moved by 5/255 — and then said the setting that DOES
 * work floods, because on a curved surface a broad lobe covers most of the
 * object. Both readings were true about spheres and neither was true about
 * anything in this game, which is made of flat panels.
 *
 * So it tests what ships. That is not loosening a threshold to get a pass:
 * the sphere was a fixture I chose for convenience, and the truck is the
 * thing the feature exists for.
 *
 * Two claims, and they only mean something together: there IS a highlight
 * (peak rises a lot), and it is a highlight rather than a wash (the mean over
 * the bodywork barely moves).
 */
{
  const sc = new THREE.Scene();
  sc.add(new THREE.HemisphereLight(0xdfeaf2, 0x6a6b4a, 0.85));
  const dl = new THREE.DirectionalLight(0xfff2d8, 1.5);
  dl.position.copy(sun).multiplyScalar(60);
  sc.add(dl);
  const truck = makeFor("truck", 0xd8c04a);
  truck.root.rotation.y = 0.6;
  sc.add(truck.root);
  const vcam = new THREE.PerspectiveCamera(42, 1, 0.1, 500);
  vcam.position.set(0.5, 3.0, 9);
  vcam.lookAt(0, 1.1, 0);
  vcam.updateMatrixWorld(true);
  WORLD_UNIFORMS.uSunDir.value.copy(sun);
  WORLD_UNIFORMS.uSunColor.value.setRGB(1.75, 1.55, 1.22);
  WORLD_UNIFORMS.uCloudCover.value = 0.9;

  const shot = () => {
    renderer.render(sc, vcam);
    const px = new Uint8Array(256 * 256 * 4);
    renderer.getContext().readPixels(0, 0, 256, 256, 6408, 5121, px);
    return px;
  };
  WORLD_UNIFORMS.uGlossScale.value = 0;
  const off = shot();
  WORLD_UNIFORMS.uGlossScale.value = 1;
  const on = shot();
  WORLD_UNIFORMS.uCloudCover.value = 0.52;

  let worst = 0, changed = 0, body = 0, sumOff = 0, sumOn = 0;
  for (let i = 0; i < off.length; i += 4) {
    const a = (off[i] + off[i + 1] + off[i + 2]) / 3;
    const b = (on[i] + on[i + 1] + on[i + 2]) / 3;
    /**
     * Lit bodywork only.
     *
     * "Anything not black" swept in the black tyres, the shadowed underside
     * and every antialiased edge pixel — which shrinks the denominator and
     * made a localised highlight read as a 12% wash. A wash is a statement
     * about the PAINT, so the paint is what it has to be measured over.
     */
    if (a < 25 && b < 25) continue;
    body++; sumOff += a; sumOn += b;
    const d = b - a;
    if (d > 4) { changed++; if (d > worst) worst = d; }
  }
  const rise = sumOn / Math.max(sumOff, 1) - 1;
  log(`truck: ${changed} pixels catch the light, brightest by ${worst.toFixed(0)}/255; ` +
      `mean over the bodywork +${(rise * 100).toFixed(1)}%`);
  check(worst >= 18, "the paint catches a highlight", `peak +${worst.toFixed(0)}/255`);
  check(changed > 200, "with real area, not a few stray pixels", `${changed} pixels`);
  check(rise < 0.05, "and it stays a highlight rather than a wash",
    `mean +${(rise * 100).toFixed(1)}%`);
  sc.remove(truck.root);
}

// --- can you see the bottom? ------------------------------------------------
/**
 * Shallow water now shows the ground under it — the real terrain albedo,
 * attenuated per channel over twice the depth. The test is variance.
 *
 * A flat two-colour gradient has almost none: every pixel of a bay is the same
 * blue-green. Water you can see through inherits the variation of the ground
 * it is lying on — sand, weed, rock — so the shallows should be visibly busier
 * than the deeps. That comparison needs no "before" to measure against, which
 * is what makes it a gate rather than a one-off.
 */
/**
 * Walk to the waterline rather than sampling for it.
 *
 * The first version demanded a bed 2-9 m down with land 14 m high only 420 m
 * away, sampled on a 2.3 km grid — which on a gently shelving coast is
 * nowhere. Find any sea, march east until the ground comes up through the
 * surface, then step back into the shallows. That finds a coast on any
 * coastline rather than on a steep one.
 */
function findCoast() {
  for (let sx = -40000; sx <= 40000; sx += 1700) {
    for (let sz = -40000; sz <= 40000; sz += 1700) {
      if (heightAt(sx, sz) > -4) continue;
      let x = sx;
      for (let step = 0; step < 90; step++) {
        x += 60;
        if (heightAt(x, sz) > 1) {
          // Back off into water a few metres deep — where a bottom is both
          // present and visible.
          for (let b = 0; b < 40; b++) {
            const px = x - 40 - b * 25;
            const d = heightAt(px, sz);
            if (d < -1.5 && d > -11) return { x: px, z: sz, bed: d };
          }
          break;
        }
      }
    }
  }
  return null;
}
const coast = findCoast();
log(coast ? `coastline at ${coast.x.toFixed(0)}, ${coast.z.toFixed(0)} — bed ${coast.bed.toFixed(1)} m down` : "no coastline found");
check(!!coast, "found a coastline to look at", coast ? `${coast.x},${coast.z}` : "none");

const spreadOf = (cam, obj) => {
  const sc = new THREE.Scene();
  sc.add(obj);
  renderer.render(sc, cam);
  const px = new Uint8Array(256 * 256 * 4);
  renderer.getContext().readPixels(0, 0, 256, 256, 6408, 5121, px);
  /**
   * Only the bottom quarter of the frame.
   *
   * Over the WHOLE frame this measured the sky, the horizon line and the sun
   * glitter — and reported more variation out at sea than in the shallows,
   * because the open-water shot had more sky in it. None of that has anything
   * to do with whether you can see the bottom.
   *
   * readPixels starts at the bottom-left, so the first rows are the nearest
   * water: two metres deep, directly below, where a bed is unambiguously
   * visible or unambiguously not.
   */
  const rows = 64;
  let n = 0, sum = 0, sumSq = 0;
  for (let i = 0; i < 256 * rows * 4; i += 4) {
    const v = 0.299 * px[i] + 0.587 * px[i + 1] + 0.114 * px[i + 2];
    sum += v; sumSq += v * v; n++;
  }
  const mean = sum / n;
  return { sd: Math.sqrt(Math.max(sumSq / n - mean * mean, 0)), mean };
};

if (coast) {
  const wcam = new THREE.PerspectiveCamera(60, 1, 0.5, 40000);
  // Low over the shallows, looking along the shore.
  wcam.position.set(coast.x, 9, coast.z);
  wcam.lookAt(coast.x - 300, -4, coast.z + 60);
  wcam.updateMatrixWorld(true);
  water.update(coast.x, coast.z);
  const shallow = spreadOf(wcam, water.mesh);

  // The same camera far out to sea, where there is no bottom to see.
  const deep = { x: coast.x - 9000, z: coast.z - 9000 };
  const dcam = wcam.clone();
  dcam.position.set(deep.x, 9, deep.z);
  dcam.lookAt(deep.x - 300, -4, deep.z + 60);
  dcam.updateMatrixWorld(true);
  water.update(deep.x, deep.z);
  const open = spreadOf(dcam, water.mesh);

  log(`nearest water: variation ${shallow.sd.toFixed(1)} (mean ${shallow.mean.toFixed(0)}) over the ` +
      `shallows, ${open.sd.toFixed(1)} (mean ${open.mean.toFixed(0)}) out at sea`);
  check(shallow.sd > open.sd * 1.3, "the shallows show the ground under them",
    `${shallow.sd.toFixed(1)} vs ${open.sd.toFixed(1)}`);
  /**
   * And deep water is nearly uniform, which is the other half of the claim.
   *
   * I first asserted the shallows would be BRIGHTER, on the reasoning that
   * sand reflects more than twenty metres of water. Wrong, and the numbers
   * said so: open water read 227 against the shallows' 143, because looking
   * out to sea is a grazing angle where fresnel is near 1 and you are seeing
   * reflected sky. Brightness here is about the angle you are looking at, not
   * about the bottom. Uniformity is the thing that is actually about the
   * bottom.
   */
  check(open.sd < 3, "and the open sea has no bottom to show", `sd ${open.sd.toFixed(1)}`);
}

// --- the thing this file exists for -----------------------------------------
const glsl = errors.filter((e) => /shader|GLSL|compile|program|ERROR:/i.test(e));
for (const e of glsl.slice(0, 6)) log(`  GL: ${e.slice(0, 300)}`);
check(glsl.length === 0, "no shader compiled with errors", `${glsl.length} GL errors`);

// --- and that the cloud shadow is actually doing something ------------------
// Same frame twice, half an hour of cloud drift apart. If the shadows are
// live the picture must change; if cloudShade were returning a constant it
// would not, and nothing above would have noticed.
const shot = () => { renderer.render(new THREE.Scene().add(terrain.group), camera); return stats("t"); };
terrain.material.uniforms.uTime.value = 40;
const a = shot();
terrain.material.uniforms.uTime.value = 40 + 1800;
const b = shot();
log(`cloud drift: mean ${a.mean.toFixed(2)} then ${b.mean.toFixed(2)} half an hour later`);
check(Math.abs(a.mean - b.mean) > 0.05, "cloud shadows move across the ground", `${Math.abs(a.mean - b.mean).toFixed(2)} change`);

log(bad ? `\n${bad} FAILED` : "\nall assertions passed");
send();

/**
 * And a look at it.
 *
 * Reuses the one renderer rather than making a second: SwiftShader would not
 * give out a second context, and because that threw OUTSIDE the try the whole
 * block vanished silently — the assertions above had already reported, so it
 * looked like a pass. Hence the try around all of it, not just the draw.
 *
 * It will not carry the full clipmap at playing resolution, but a quarter of a
 * million pixels is enough to see whether the light is right, and graphics
 * work judged only by assertions is graphics work nobody has looked at.
 */
try {
  // Small, and looking DOWN rather than along. SwiftShader is a CPU
  // rasteriser and a horizon view of a 24 km clipmap is millions of triangles
  // of overdraw — it does not fail, it just never finishes. Tilted down, most
  // of them are off screen or facing away, and it returns in seconds.
  const W = 400, H = 300;
  canvas.width = W; canvas.height = H;
  renderer.setSize(W, H, false);
  const scene = new THREE.Scene();
  const cam2 = new THREE.PerspectiveCamera(62, W / H, 0.5, 60000);
  // Low, looking across country into a sun near the horizon — which is where
  // the backscatter and the glitter path have something to say.
  // Over the coastline if there is one, because that is where this pass did
  // its work — a landscape shot of dry hills would prove nothing about water.
  const eye = coast
    ? new THREE.Vector3(coast.x + 260, 0, coast.z - 160)
    : new THREE.Vector3(2400, 0, -1800);
  eye.y = Math.max(heightAt(eye.x, eye.z), 0) + 190;
  cam2.position.copy(eye);
  cam2.lookAt(eye.x - 420, eye.y - 230, eye.z + 320);
  const sun2 = new THREE.Vector3(0.62, 0.20, 0.72).normalize();
  sky.mesh.removeFromParent();
  cam2.add(sky.mesh);
  scene.add(cam2);
  for (const m of [terrain.material, water.material, sky.material]) {
    const u = m.uniforms;
    if (u.uSunDir) u.uSunDir.value.copy(sun2);
    if (u.uSunColor) u.uSunColor.value.setRGB(1.85, 1.30, 0.86);
    if (u.uSkyAmbient) u.uSkyAmbient.value.setRGB(0.26, 0.33, 0.46);
    if (u.uGroundAmbient) u.uGroundAmbient.value.setRGB(0.07, 0.07, 0.06);
    if (u.uCloudCover) u.uCloudCover.value = 0.46;
    if (u.uTime) u.uTime.value = 120;
    if (u.uFogDensity) u.uFogDensity.value = 0.00009;
  }
  terrain.update(eye.x, eye.z);
  water.update(eye.x, eye.z);
  water.update(eye.x, eye.z);
  scene.add(terrain.group, water.mesh);
  renderer.render(scene, cam2);
  const png = canvas.toDataURL("image/png");
  log(`landscape render: ${png.length} bytes at ${W}x${H}`);
  await fetch("http://127.0.0.1:8916/", { method: "POST", body: png }).catch(() => {});
} catch (e) {
  log(`landscape render failed: ${e.message}`);
}
send();
</script>
