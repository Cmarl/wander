<!doctype html><meta charset=utf8>
<!--
  Where exactly is the gap above the compass?

  Clyde: "Make sure PCC fixed the gap above the compass soon too pls"

  Layout bugs are the ones most worth measuring rather than eyeballing — the
  last several in this HUD were all a number being a different number than
  anyone assumed. This builds the real HUD, puts it in a phone-shaped and a
  desktop-shaped viewport, and prints where every box actually is.

  "The gap above the compass" could be any of three things, so all three are
  measured: dead space between the top of the screen and the compass box,
  dead space INSIDE the compass box above its lettering, and the compass
  sitting lower than the panel it is supposed to line up with.

  Run:  npm run dev
        open http://localhost:5173/tools/hud-layout.html

  Not a build entry: vite builds index.html only, so this never ships.
--><body style="margin:0"><div id=ui></div>
<pre id=out style="position:fixed;bottom:0;left:0;z-index:99;background:#000;color:#ddd;font:10px monospace;max-height:50vh;overflow:auto"></pre>
<script type="module">
import "../src/style.css";
import { Hud } from "../src/ui/hud.ts";

const out = document.getElementById("out");
const lines = [];
const log = (s) => { out.textContent += s + "\n"; lines.push(s); };
const send = () => fetch("http://127.0.0.1:8915/", { method: "POST", body: lines.join("\n") }).catch(() => {});
window.onerror = (m, f, l) => { log(`THREW: ${m} (line ${l})`); send(); };
let bad = 0;
const check = (ok, label, detail) => { if (!ok) bad++; log(`${ok ? "  ok  " : "  FAIL"}  ${label.padEnd(48)} ${detail}`); };

// Hud takes (controls, audio, net). Only the shapes it reads at construction
// matter here — nothing in this probe presses anything.
// With isTouch true the HUD wires up the stick and every button, so the stub
// has to answer for those too. None of them are pressed here — this probe
// measures where things ARE, not what they do.
const controls = {
  isTouch: true,
  pads: { snapshot: () => null, bindings: {}, listenFor: null },
  bindStick() {}, bindButton() {}, bindLook() {}, bindZoom() {},
};
const audio = { toggleMute: () => false, setVolume() {}, volume: 0.7, muted: false };
const net = { name: "probe", world: "probe", join() {}, solo() {} };
const hud = new Hud(controls, audio, net);
hud.update({
  elevation: 412, region: "Western Meadow Vale", x: 1200, z: 800, km: 12.4,
  fps: 60, headingDeg: 34, prompt: "", promptOn: "interact", speed: 0,
});
await new Promise((r) => requestAnimationFrame(() => requestAnimationFrame(r)));

const box = (sel) => {
  const el = document.querySelector(sel);
  if (!el) return null;
  const r = el.getBoundingClientRect();
  return { el, top: r.top, bottom: r.bottom, left: r.left, right: r.right, h: r.height, w: r.width };
};

/**
 * Where the compass's ink actually starts.
 *
 * The box is one thing and the lettering inside it is another. A 40 px box
 * whose tape sits at the top still LOOKS like it begins at the tape, so the
 * distance that reads as "the gap" is from the screen edge to the first
 * painted thing, not to the box.
 */
function report(label) {
  log(`\n--- ${label}: ${window.innerWidth} x ${window.innerHeight} ---`);
  const compass = box(".compass");
  const tape = box("#h-compass");
  const panel = box(".panel-left");
  const panelText = box(".panel-left .panel-text");
  const pin = box(".pin-lead");

  if (!compass) { log("no compass found"); return null; }
  // --pad is `max(14px, env(...))`, which parseFloat cannot read — it returned
  // 0 and made every comparison below meaningless. Measure it off something
  // that actually uses it instead of trying to parse the expression.
  const probe = document.createElement("div");
  probe.style.cssText = "position:absolute;top:var(--pad);height:0";
  document.getElementById("ui").appendChild(probe);
  const pad = probe.getBoundingClientRect().top;
  probe.remove();
  log(`--pad resolves to ${pad.toFixed(1)}px`);
  log(`compass box   top ${compass.top.toFixed(1)}  height ${compass.h.toFixed(1)}  bottom ${compass.bottom.toFixed(1)}`);
  if (tape) log(`compass tape  top ${tape.top.toFixed(1)}  height ${tape.h.toFixed(1)}  bottom ${tape.bottom.toFixed(1)}`);
  if (panel) log(`panel box     top ${panel.top.toFixed(1)}  height ${panel.h.toFixed(1)}  (its shaded background)`);
  if (panelText) log(`panel text    top ${panelText.top.toFixed(1)}`);
  if (pin) log(`pin row       top ${pin.top.toFixed(1)}  height ${pin.h.toFixed(1)}  (${getComputedStyle(pin.el).opacity} opacity)`);

  const aboveBox = compass.top;
  const insideBox = tape ? tape.top - compass.top : 0;
  const toInk = tape ? tape.top : compass.top;
  log(`GAP: ${aboveBox.toFixed(1)}px above the box, ${insideBox.toFixed(1)}px inside it before the tape` +
      ` = ${toInk.toFixed(1)}px of nothing above the lettering`);
  if (panel) log(`compass lettering sits ${(toInk - panel.top).toFixed(1)}px below the top of the metadata panel`);
  return { compass, tape, panel, pin, pad, toInk, aboveBox, insideBox };
}

/**
 * One viewport per run, and the runner supplies it.
 *
 * The first version set documentElement's width and height and reported three
 * sizes. It was reporting the same measurement three times: resizing that
 * element does not change window.innerWidth, so not one media query changed
 * and portrait, landscape and desktop were all the browser's actual window.
 * Three green rows, one of them tested.
 *
 * A media query can only be driven by the real viewport, so the shape is
 * passed in with --window-size and this measures whatever it is given.
 */
const label = `${window.innerWidth} x ${window.innerHeight}` +
  (window.innerWidth > window.innerHeight ? " landscape" : " portrait");
const results = { [label]: report(label) };

log("");
for (const key of Object.keys(results)) {
  const r = results[key];
  if (!r) continue;
  const label = key;
  // The real question: does the compass's shading start where the panel's
  // does? One flush to the screen edge and one floating below it is exactly
  // what reads as dead space.
  check(r.panel ? Math.abs(r.compass.top - r.panel.top) < 2 : false,
    `${label}: compass shading starts level with the panel's`,
    r.panel ? `compass ${r.compass.top.toFixed(1)} vs panel ${r.panel.top.toFixed(1)}` : "no panel");
  check(r.compass.bottom - r.tape.bottom < 10,
    `${label}: no dead box left under the tape`,
    `${(r.compass.bottom - r.tape.bottom).toFixed(1)}px of empty box`);
}

/**
 * The touch button cluster.
 *
 * Clyde: "Let's get rid of the run button. Person is always on run mode. Put
 * the get in the truck/action button where it was, make the jump button the
 * big button in its old spot".
 *
 * The cluster is column-reverse, so DOM order is bottom-to-top on screen and
 * reading the markup tells you nothing about what your thumb finds. Measured
 * positions are the only way to check this.
 */
/**
 * Ranked by distance from the thumb, not by one axis.
 *
 * Sorting on `top` worked in portrait, where the cluster is a single column,
 * and reported nonsense in short landscape, where it wraps into two columns
 * of three — two columns interleave into one list and the order means
 * nothing. "Under your thumb" is a 2D fact about the bottom-right corner, so
 * that is what it measures. The portrait answer comes out the same; the
 * landscape one comes out right instead of scrambled.
 */
const corner = { x: window.innerWidth, y: window.innerHeight };
const byThumb = (el) => {
  const r = el.getBoundingClientRect();
  return Math.hypot(corner.x - (r.left + r.width / 2), corner.y - (r.top + r.height / 2));
};
const btns = [...document.querySelectorAll(".buttons .btn")]
  .map((el) => ({ id: el.id, r: el.getBoundingClientRect(), el, d: byThumb(el) }))
  .filter((b) => b.r.height > 0)
  .sort((a, b) => a.d - b.d);
log(`\nbuttons, nearest the thumb first: ${btns.map((b) => `${b.id}(${b.r.width.toFixed(0)}px, ${b.d.toFixed(0)}px away)`).join(" ")}`);

check(!document.getElementById("b-sprint"), "the RUN button is gone", "no b-sprint");
check(btns[0]?.id === "b-jump", "JUMP is nearest the thumb", btns[0]?.id ?? "none");
check(btns[0] && btns[1] && btns[0].r.width > btns[1].r.width,
  "and it is the big one", `${btns[0]?.r.width.toFixed(0)}px vs ${btns[1]?.r.width.toFixed(0)}px`);
/**
 * "Next to JUMP" means the one above it in the SAME column.
 *
 * Straight-line distance from the corner is too crude once the cluster wraps:
 * in short landscape it becomes two columns of three, and the bottom button
 * of the NEXT column sits 113px from the thumb against 114px for the one
 * directly above JUMP. A one-pixel tie decided the assertion, and it decided
 * it wrong — the code was right and the ruler was not.
 */
const colOf = (b) => b.r.left + b.r.width / 2;
const jumpB = btns.find((b) => b.id === "b-jump");
const sameColumn = btns
  .filter((b) => Math.abs(colOf(b) - colOf(jumpB)) < 30 && b.id !== "b-jump")
  .sort((a, b) => b.r.top - a.r.top);
log(`above JUMP in its own column: ${sameColumn.map((b) => b.id).join(" ") || "nothing"}`);
check(sameColumn[0]?.id === "b-interact", "the action button sits directly above it",
  sameColumn[0]?.id ?? "none");
check(document.getElementById("b-down")?.classList.contains("hidden"),
  "DOWN is out of the way on foot", "hidden");

// And it appears in the air, where RUN used to be the only way down.
hud.setJumpLabel("CLIMB");
const down = document.getElementById("b-down");
check(!down?.classList.contains("hidden"), "DOWN appears once you are flying", "shown");
const flying = [...document.querySelectorAll(".buttons .btn")]
  .map((el) => ({ id: el.id, r: el.getBoundingClientRect(), d: byThumb(el) }))
  .filter((b) => b.r.height > 0)
  .sort((a, b) => a.d - b.d);
log(`flying, nearest the thumb first: ${flying.map((b) => b.id).join(" ")}`);
const flyCol = flying
  .filter((b) => Math.abs(b.r.left + b.r.width / 2 - colOf(jumpB)) < 30 && b.id !== "b-jump")
  .sort((a, b) => b.r.top - a.r.top);
log(`flying, above JUMP: ${flyCol.map((b) => b.id).join(" ")}`);
check(flyCol[1]?.id === "b-down", "in the slot RUN used to hold — third up", flyCol[1]?.id ?? "none");
hud.setJumpLabel("JUMP");

/**
 * Text that fits its button.
 *
 * Clyde: "Button text sizing is wonky". Two things in the screenshots: JUMP
 * shouting at 19px among 10px neighbours, and the action label breaking
 * mid-word into "DRIVE / THE / TRUC / K" with the K clipped off the bottom.
 *
 * Both are measurable without looking: a label that does not fit reports a
 * scrollWidth larger than its clientWidth, and a label that wraps is taller
 * than one line. Nothing here needs an opinion.
 */
const withPrompt = (text) => hud.update({
  elevation: 412, region: "Western Meadow Vale", x: 1200, z: 800, km: 12.4,
  fps: 60, headingDeg: 34, prompt: text, promptOn: "interact", speed: 0,
});
/**
 * Measured on the TEXT, not on the button.
 *
 * scrollWidth and scrollHeight on a <button> describe the button's own box,
 * which is 50px tall for an 11px line — so dividing scrollHeight by the line
 * height reported "5.3 lines" for a label sitting perfectly on one, and
 * scrollWidth claimed a 10px overflow that was just padding arithmetic. Two
 * failed assertions against a correct layout.
 *
 * A Range over the contents gives one client rect per LINE BOX. That is
 * literally the question — how many lines is this on, and how wide is the
 * ink — with nothing to misread.
 */
const act = document.getElementById("b-interact");
const textRects = () => {
  const range = document.createRange();
  range.selectNodeContents(act);
  return [...range.getClientRects()];
};
const fits = (verb) => {
  withPrompt(verb);
  const rects = textRects();
  const box = act.getBoundingClientRect();
  const cs = getComputedStyle(act);
  const padL = parseFloat(cs.paddingLeft), padR = parseFloat(cs.paddingRight);
  const widest = Math.max(...rects.map((r) => r.width));
  const room = box.width - padL - padR;
  log(`"${verb}": button ${box.width.toFixed(0)}px, ink ${widest.toFixed(0)}px on ` +
      `${rects.length} line${rects.length === 1 ? "" : "s"}, room ${room.toFixed(0)}px, font ${cs.fontSize}`);
  return { rects, widest, room, box };
};

const drive = fits("drive the truck");
check(drive.rects.length === 1, "the action label sits on one line", `${drive.rects.length} lines`);
check(drive.widest <= drive.room + 1, "and is not cut off",
  `ink ${drive.widest.toFixed(0)}px in ${drive.room.toFixed(0)}px`);

// The longest verb in the game, which is the one that has to fit.
const longest = fits("call the aeroplane");
check(longest.rects.length === 1, "so does the longest one in the game", `${longest.rects.length} lines`);
check(longest.widest <= longest.room + 1, "without clipping",
  `ink ${longest.widest.toFixed(0)}px in ${longest.room.toFixed(0)}px`);
check(longest.box.right <= window.innerWidth, "and it stays on screen",
  `right edge ${longest.box.right.toFixed(0)} of ${window.innerWidth}`);

/**
 * Right edges in line — within a column.
 *
 * Comparing every button in the cluster reported 178px of drift in short
 * landscape, which is correct and meaningless: the cluster wraps into two
 * columns there, so of course the right edges differ by a column. The claim
 * worth making is that a longer label does not shove the circles sideways,
 * and that is a claim about one column.
 */
const inCol = [...document.querySelectorAll(".buttons .btn")]
  .map((el) => el.getBoundingClientRect())
  // Within 30px of the pill's right edge, which is one column. 200px was
  // wider than the gap between columns in short landscape, so it swept in the
  // next column and reported its offset as drift.
  .filter((r) => r.height > 0 && Math.abs(r.right - longest.box.right) < 30);
const colSpread = Math.max(...inCol.map((r) => r.right)) - Math.min(...inCol.map((r) => r.right));
log("all right edges: " + [...document.querySelectorAll(".buttons .btn")]
  .map((el) => { const r = el.getBoundingClientRect();
    return r.height ? `${el.id} r=${r.right.toFixed(0)} t=${r.top.toFixed(0)} w=${r.width.toFixed(0)}` : null; })
  .filter(Boolean).join("  "));
log(`column beside the pill: ${inCol.length} buttons, ${colSpread.toFixed(1)}px of right-edge drift`);
// A spread over one element is always zero. Without this the assertion below
// passes hardest exactly when the grouping has gone wrong and found nothing
// to compare the pill against.
check(inCol.length >= 2, "there is something to compare the pill against",
  `${inCol.length} buttons in its column`);
check(colSpread < 2, "and the buttons beside it line up on the right",
  `${colSpread.toFixed(1)}px of drift`);

// Sizes in one family: the big one a step up, not a different species.
const sizes = [...document.querySelectorAll(".buttons .btn")]
  .filter((el) => el.getBoundingClientRect().height > 0)
  .map((el) => ({ id: el.id, px: parseFloat(getComputedStyle(el).fontSize) }));
log(`font sizes: ${sizes.map((x) => `${x.id} ${x.px}px`).join(", ")}`);
const big = sizes.find((x) => x.id === "b-jump").px;
const rest = sizes.filter((x) => x.id !== "b-jump").map((x) => x.px);
check(big <= Math.max(...rest) * 1.6, "JUMP is a step up, not a shout",
  `${big}px against ${Math.max(...rest)}px`);
check(Math.max(...rest) - Math.min(...rest) <= 1.5, "and the rest match each other",
  `${Math.min(...rest)}-${Math.max(...rest)}px`);
// Leave a real label on screen: this page is also what gets photographed.
withPrompt("drive the truck");

// Thumb-sized, all of them, after the reshuffle.
const small = Math.min(...btns.map((b) => b.r.height));
check(small >= 44, "every button is still thumb-sized", `smallest ${small.toFixed(0)}px`);

log(bad ? `\n${bad} FAILED` : "\nall assertions passed");
send();
</script>
