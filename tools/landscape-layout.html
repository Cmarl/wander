<!doctype html><meta charset=utf8>
<!-- Measures the touch layout in a phone-landscape viewport. -->
<link rel="stylesheet" href="../src/style.css">
<body style="margin:0;background:#2a2a1a">
<div id="ui"></div>
<script type="module">
const ui = document.getElementById("ui");
ui.innerHTML = `
  <div class="panel panel-left"><div class="clock">07:40</div><div class="sub">Golden Steppe</div><div class="sub">The Hollow Hollow · 18 m</div></div>
  <div class="panel panel-right"><div class="sub">33172, -1971</div><div class="sub">4.98 km travelled</div><div class="sub dim">60 fps</div>
    <div class="audio"><input type="range" class="vol" value="60"><button class="mute">sound</button></div></div>
  <div class="compass"><div class="compass-tape"></div><div class="compass-needle"></div></div>
  <div class="buttons">
    <button class="btn" id="b-interact">⏎</button><button class="btn" id="b-jump">⤴</button>
    <button class="btn small" id="b-sprint">RUN</button><button class="btn small" id="b-glass">LOOK</button>
    <button class="btn small" id="b-camp">CAMP</button><button class="btn small" id="b-cruise">GO</button>
  </div>
  <div class="hud-stack compact"><button class="hud-ico">\u25a4</button><button class="hud-ico">\u22ef</button>
    <div class="hud-more" id="more"><button class="hud-btn">3 here</button><button class="hud-btn">fullscreen</button><button class="hud-btn">controls</button></div></div>`;
await new Promise((r) => requestAnimationFrame(() => requestAnimationFrame(r)));

const out = [];
const W = innerWidth, H = innerHeight;
out.push(`viewport ${W} x ${H}`);
const r = (sel) => document.querySelector(sel).getBoundingClientRect();
const btns = [...document.querySelectorAll(".btn")].map((b) => b.getBoundingClientRect());
const stack = r(".hud-stack"), right = r(".panel-right");
const bb = btns.reduce((a, b) => ({ top: Math.min(a.top, b.top), bottom: Math.max(a.bottom, b.bottom),
  left: Math.min(a.left, b.left), right: Math.max(a.right, b.right) }), { top: 1e9, bottom: -1e9, left: 1e9, right: -1e9 });
out.push(`button cluster ${Math.round(bb.right-bb.left)} x ${Math.round(bb.bottom-bb.top)} at top ${Math.round(bb.top)}`);
const overlap = (a, b) => !(a.right < b.left || b.right < a.left || a.bottom < b.top || b.bottom < a.top);
out.push(`buttons overlap the right panel: ${overlap(bb, right)}  (must be false)`);
// The left thumb zone: bottom-left quadrant where the stick appears.
const thumb = { left: 0, right: W * 0.45, top: H * 0.5, bottom: H };
out.push(`menu stack at left ${Math.round(stack.left)} top ${Math.round(stack.top)} ${Math.round(stack.width)}x${Math.round(stack.height)}; thumb zone top ${Math.round(thumb.top)} right ${Math.round(thumb.right)}`);
 out.push(`menu buttons inside the left thumb zone: ${overlap(stack, thumb)}  (must be false)`);
out.push(`button cluster fits above the bottom edge: ${bb.top > 0}  height used ${Math.round((bb.bottom-bb.top)/H*100)}% of screen`);
// Everything must be on screen.
let off = 0;
for (const b of [...btns, stack, right]) if (b.top < 0 || b.bottom > H || b.left < 0 || b.right > W) off++;
out.push(`elements off screen: ${off}  (must be 0)`);
 const more = document.getElementById("more").getBoundingClientRect();
 out.push(`collapsed menu footprint ${Math.round(stack.width)}x${Math.round(stack.height)} (was 96x298 as four pills)`);
 out.push(`hidden menu takes no space: ${more.width === 0 && more.height === 0}`);
fetch("http://127.0.0.1:8914/", { method: "POST", body: "land|" + out.join("\n") }).catch(() => {});
</script>
